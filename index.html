<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frederiks Skifahrt</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172b42;background:#f5f8fc}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:1180px;margin:auto}h1{margin:0 0 5px;font-size:clamp(23px,3vw,34px)}p{margin:0 0 15px;color:#52657b}.panel{background:white;border:1px solid #dce5ef;border-radius:16px;padding:16px;box-shadow:0 5px 20px #1d35500c}svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;cursor:crosshair}.controls{display:flex;flex-wrap:wrap;gap:15px;align-items:center;margin-top:12px}.controls label{display:flex;align-items:center;gap:8px}input[type=range]{flex:1;min-width:190px;accent-color:#1767aa}input[type=checkbox]{accent-color:#1767aa}.readouts{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.readout{border:1px solid #dce5ef;border-radius:12px;padding:10px 15px;min-width:155px;background:#fafcff}.readout strong{display:block;font-size:25px;font-variant-numeric:tabular-nums}.readout small{color:#52657b}.help{font-size:14px;color:#52657b;margin-top:10px}.btn{border:1px solid #b5c8dd;background:#fff;border-radius:9px;padding:9px 13px;color:#183e61;font-weight:600;cursor:pointer}.btn:hover{background:#eaf4fc}input[type=range]{height:30px;touch-action:pan-y}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:#52657b}.legend span:before{content:' ';display:inline-block;width:20px;height:3px;vertical-align:middle;margin-right:6px;background:var(--c)}@media(max-width:600px){body{padding:8px}.panel{padding:9px}}
</style></head><body><main class="wrap"><h1>Frederiks Skifahrt</h1><p>Bewege Frederik entlang des Graphen oder benutze den Regler</p><section class="panel"><svg id="plot" viewBox="0 0 1100 550" role="img" aria-label="Interaktives Höhenprofil der Langlaufloipe mit verschiebbarem Skifahrer und Tangente"><defs><clipPath id="clip"><rect x="76" y="24" width="978" height="450"/></clipPath></defs><g id="grid"></g><g id="curve" clip-path="url(#clip)"></g><g id="dynamic" clip-path="url(#clip)"></g><g id="axes"></g></svg><div class="controls"><label for="position">Frederiks Position</label><input id="position" type="range" min="0" max="20" step="0.001" value="1.5"><button class="btn" id="reset">Zurück zum Start</button></div><div class="readouts"><div class="readout"><small>Zurückgelegte Strecke</small><strong id="xvalue">1,50</strong></div><div class="readout"><small>Höhe über NN</small><strong id="yvalue">–</strong></div><div class="readout"><small>Verlauf</small><strong id="status" style="font-size:19px">–</strong></div></div><div class="controls"><label><input type="checkbox" id="tangent"> Tangente anzeigen</label><label><input type="checkbox" id="triangle"> Steigungsdreieck anzeigen</label></div><p class="help">Die x-Achse zeigt die zurückgelegte Strecke in Metern, die y-Achse die Höhe über NN.</p></section></main><script>
'use strict';
// Quintic Hermite interpolation: shared position, slope and curvature at every joint.
// Each node: [x, y, f'(x), f''(x)]. All data use exact rational decimal values.
const nodes=[[0,5,0.75,0],[4,8,0,-1.5],[7,4,0,1.5],[10,6,0,-0.3],[20,1,0,0.3]];
const segments=[];
for(let i=0;i<nodes.length-1;i++){
  const [x0,y0,m0,a0]=nodes[i], [x1,y1,m1,a1]=nodes[i+1], h=x1-x0;
  const c0=y0,c1=h*m0,c2=h*h*a0/2;
  const R=y1-c0-c1-c2, S=h*m1-c1-2*c2, T=h*h*a1-2*c2;
  // Solve endpoint constraints for c3, c4, c5.
  const c5=(T-6*S+12*R)/2;
  const c4=S-3*R-2*c5;
  const c3=R-c4-c5;
  segments.push({x0,h,c:[c0,c1,c2,c3,c4,c5]});
}
// Extra smooth transition at the second summit (x=10):
// the left and right third derivatives also match (f'''(10)=3/50).
segments[2].c=[4,0,27/4,0,-113/25,-1329/100,2039/100,-733/100];
function evaluate(x){
  x=Math.max(0,Math.min(20,x));
  let i=segments.length-1;
  for(let k=0;k<segments.length;k++){if(x<=segments[k].x0+segments[k].h){i=k;break}}
  const {x0,h,c}=segments[i],t=(x-x0)/h;
  // Horner evaluation works for both quintic and seventh-degree segments.
  let y=c[c.length-1], dp=0, ddp=0;
  for(let j=c.length-2;j>=0;j--){
    ddp=ddp*t+2*dp;
    dp=dp*t+y;
    y=y*t+c[j];
  }
  const d=dp/h, dd=ddp/(h*h);
  return {y,d,dd};
}
const svg=document.getElementById('plot'), grid=document.getElementById('grid'), curve=document.getElementById('curve'),dyn=document.getElementById('dynamic'),axes=document.getElementById('axes');const input=document.getElementById('position');const X=x=>76+x*48.9,Y=y=>474-y*48.5;const ns='http://www.w3.org/2000/svg';function element(tag,attrs={},parent){let el=document.createElementNS(ns,tag);for(let k in attrs)el.setAttribute(k,attrs[k]);if(parent)parent.appendChild(el);return el}function line(x1,y1,x2,y2,stroke,width=1,parent=grid,other={}){return element('line',{x1,y1,x2,y2,stroke,'stroke-width':width,...other},parent)}function label(text,x,y,parent=axes,other={}){let e=element('text',{x,y,'font-size':14,fill:'#52657b',...other},parent);e.textContent=text;return e}
for(let x=0;x<=20;x+=2){line(X(x),Y(0),X(x),Y(9),'#e9eef4');label(String(x*100),X(x),Y(0)+24,axes,{'text-anchor':'middle'})}for(let y=0;y<=9;y++){line(X(0),Y(y),X(20),Y(y),'#e9eef4');label(String(1150+10*y),X(0)-13,Y(y)+5,axes,{'text-anchor':'end'})}line(X(0),Y(0),X(20)+15,Y(0),'#273b51',2,axes);line(X(0),Y(0)+9,X(0),Y(9)-9,'#273b51',2,axes);label('Zurückgelegte Strecke (m)',X(20)-12,Y(0)+52,axes,{'text-anchor':'end'});label('Höhe über NN (m)',X(0)+6,Y(9)-15);let path='';for(let x=0;x<=20.00001;x+=.025){path+=(x===0?'M':'L')+X(x).toFixed(2)+','+Y(evaluate(x).y).toFixed(2)+' '}element('path',{d:path,fill:'none',stroke:'#1b5c94','stroke-width':4,'stroke-linejoin':'round','stroke-linecap':'round'},curve);
const opts=['tangent','triangle'].map(id=>document.getElementById(id));const fmt=v=>(Math.abs(v)<0.005?0:v).toFixed(2).replace('.',',');function render(){let x=+input.value,{y,d}=evaluate(x);document.getElementById('xvalue').textContent=fmt(x*100)+' m';document.getElementById('yvalue').textContent=fmt(1150+10*y)+' m';document.getElementById('status').textContent=Math.abs(d)<0.015?'Waagerecht':d>0?'Bergauf ↗':'Bergab ↘';dyn.replaceChildren();if(opts[0].checked){let a=Math.max(0,x-2.8),b=Math.min(20,x+2.8);line(X(a),Y(y+d*(a-x)),X(b),Y(y+d*(b-x)),'#e38331',3,dyn)}if(opts[1].checked){let dir=x>17?-1:1,dx=2*dir;line(X(x),Y(y),X(x+dx),Y(y),'#24a18c',3,dyn,{'stroke-dasharray':'7 5'});line(X(x+dx),Y(y),X(x+dx),Y(y+d*dx),'#24a18c',3,dyn,{'stroke-dasharray':'7 5'});label('Δx = '+fmt(dx*100)+' m',X(x+dx/2),Y(y)+22,dyn,{'text-anchor':'middle',fill:'#168775'});label('Δy = '+fmt(d*dx*10)+' m',X(x+dx)+8,Y(y+d*dx/2),dyn,{fill:'#168775'})}element('circle',{cx:X(x),cy:Y(y),r:9,fill:'#ffffff',stroke:'#163e65','stroke-width':3},dyn);
// Hand-drawn skier inspired by the supplied reference. Entire skier rotates with the tangent.
const angle=Math.atan2(-d*48.5,48.9)*180/Math.PI;
const skier=element('g',{transform:`translate(${X(x)} ${Y(y)}) rotate(${angle.toFixed(3)})`},dyn);
// Skis run along the tangent, with the skier standing perpendicular to them.
element('path',{d:'M -31 2 Q -35 0 -29 -2 L 24 -2 Q 31 -2 33 -7',fill:'none',stroke:'#252b30','stroke-width':3.3,'stroke-linecap':'round'},skier);
element('path',{d:'M -27 5 L 25 1 Q 30 0 32 -4',fill:'none',stroke:'#646b70','stroke-width':2,'stroke-linecap':'round'},skier);
// Boots and legs
element('path',{d:'M -13 -5 L -15 -27 L -5 -28 L -4 -8 L 2 -6 L 1 -2 L -13 -2 Z',fill:'#54585a',stroke:'#202629','stroke-width':2},skier);
element('path',{d:'M 2 -6 L 1 -29 L 10 -28 L 10 -8 L 17 -6 L 16 -2 L 2 -2 Z',fill:'#777b7d',stroke:'#202629','stroke-width':2},skier);
// Jacket with collar and short sleeves
element('path',{d:'M -17 -31 Q -22 -46 -19 -59 Q -17 -65 -7 -67 L 7 -65 Q 15 -59 12 -46 L 11 -30 Q -1 -25 -17 -31 Z',fill:'#5b6062',stroke:'#202629','stroke-width':2.5,'stroke-linejoin':'round'},skier);
element('path',{d:'M -8 -62 L -6 -32 M 4 -62 L 5 -31 M -15 -42 Q -2 -39 11 -42',fill:'none',stroke:'#292e30','stroke-width':1.7},skier);
// Face, long nose, glasses
element('path',{d:'M -12 -68 Q -21 -78 -16 -90 Q -11 -100 1 -98 Q 13 -95 12 -84 L 8 -73 L 16 -70 L 9 -66 Q 3 -64 -2 -68 Z',fill:'#f8f5ed',stroke:'#202629','stroke-width':2},skier);
element('path',{d:'M -17 -82 Q -8 -85 0 -81 L 9 -81 L 11 -76 L 1 -75 L -4 -78 L -11 -75 L -17 -78 Z',fill:'#f8f5ed',stroke:'#202629','stroke-width':2},skier);
element('path',{d:'M -2 -71 Q 3 -68 7 -70',fill:'none',stroke:'#202629','stroke-width':1.6},skier);
// Characteristic tall, floppy curved hat
element('path',{d:'M -20 -86 Q -24 -112 -12 -133 Q -6 -143 5 -139 Q 14 -136 19 -124 Q 26 -113 19 -107 Q 12 -102 3 -111 L -1 -100 L -2 -87 Z',fill:'#a6a6a1',stroke:'#202629','stroke-width':2.5,'stroke-linejoin':'round'},skier);
element('path',{d:'M -20 -89 Q -9 -94 0 -90 L -1 -83 Q -12 -86 -19 -82 Z',fill:'#55595a',stroke:'#202629','stroke-width':2},skier);
// Arms, mittens and ski poles
element('path',{d:'M 9 -56 L 20 -46 L 23 -52 L 13 -64 Z',fill:'#55595a',stroke:'#202629','stroke-width':2},skier);
element('path',{d:'M -16 -57 L -6 -47 L -1 -52 L -12 -65 Z',fill:'#55595a',stroke:'#202629','stroke-width':2},skier);
element('ellipse',{cx:23,cy:-51,rx:5,ry:6,fill:'#f8f5ed',stroke:'#202629','stroke-width':2},skier);
element('ellipse',{cx:-1,cy:-52,rx:5,ry:6,fill:'#f8f5ed',stroke:'#202629','stroke-width':2},skier);
line(25,-48,27,0,'#4b5052',1.8,skier);
line(1,-49,4,0,'#4b5052',1.8,skier);
line(20,0,33,0,'#4b5052',1.8,skier);
line(-3,0,10,0,'#4b5052',1.8,skier);
}// Fine slider increments and a gentle magnetic snap while dragging on the graph.
const landmarks=[4,7,10,15];
input.addEventListener('input',render);opts.forEach(o=>o.addEventListener('change',render));document.getElementById('reset').addEventListener('click',()=>{input.value='1.5';render()});let dragging=false;function updatePointer(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();if(!m)return;const v=p.matrixTransform(m.inverse());let pos=Math.max(0,Math.min(20,(v.x-76)/48.9));
const nearest=landmarks.reduce((a,b)=>Math.abs(b-pos)<Math.abs(a-pos)?b:a);
if(Math.abs(pos-nearest)<0.18)pos=nearest;
input.value=pos;render()}svg.addEventListener('pointerdown',e=>{dragging=true;svg.setPointerCapture(e.pointerId);updatePointer(e)});svg.addEventListener('pointermove',e=>{if(dragging)updatePointer(e)});svg.addEventListener('pointerup',()=>dragging=false);svg.addEventListener('pointercancel',()=>dragging=false);render();
</script></body></html>
